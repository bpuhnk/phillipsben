services:
  phillipsben-com:
    build: .
    container_name: phillipsben-com
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
      - SITE_URL=${SITE_URL:-https://phillipsben.com}
      # Career assistant (/ask) — see .env.example for what each does.
      - ASSISTANT_PROVIDER=${ASSISTANT_PROVIDER:-local}
      - SWITCHBOARD_URL=${SWITCHBOARD_URL:-}
      - SWITCHBOARD_TOKEN=${SWITCHBOARD_TOKEN:-}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-gemma-e4b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - tunnel
    expose:
      - "3000"

networks:
  tunnel:
    external: true
    name: ${CF_TUNNEL_NETWORK:-cloudflare-tunnel}
